[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "discharge-summary-agent"
version = "1.0.0"
description = "Agentic AI system for clinical discharge summary generation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "openai>=1.35.0",
    "PyMuPDF>=1.24.0",
    "pdfplumber>=0.11.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.2.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "matplotlib>=3.9.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "evaluation*"]
